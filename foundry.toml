# Para quem preferir Foundry: os contratos compilam com forge (sem via-IR).
# Os testes deste repositório são em Hardhat (contracts/test/); ver README, seção "Decisões".
[profile.default]
src = "contracts/src"
test = "contracts/forge-test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
